  --texto: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;

}
@media (prefers-color-scheme: dark) {

    --anil: #93A6F2; --anil-suave: #222B55; --rio: #1D2A55;
    --urucum: #F07A5F; --palha: #E2B552; --folha: #63C48F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --cal: #0E1224; --card: #161B34; --tinta: #E8EAF3; --muted: #A2A8BE; --linha: #2A3152;

}
* { box-sizing: border-box; }
body { background: var(--cal); color: var(--tinta); font-family: var(--texto); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--anil); }
a { color: var(--anil); }
:focus-visible { outline: 3px solid var(--urucum); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; text-wrap: balance; margin: 0; }
.envolve { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rotulo { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }

/* cabecalho */

.marca { color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; margin-right: auto; }

nav { display: flex; gap: 4px; }
nav a { color: #fff; text-decoration: none; font-size: 15px; padding: 7px 11px; border-radius: 999px; }
nav a[aria-current="page"] { background: rgba(255,255,255,.18); }
:root[data-theme="dark"] .topo, :root[data-theme="dark"] body::before { background: #1A2457; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .topo, :root:not([data-theme="light"]) body::before { background: #1A2457; } }

/* inicio */
.abertura { padding-block: 26px 10px; display: grid; gap: 12px; }
.abertura h1 { font-size: clamp(34px, 8vw, 64px); font-weight: 800; letter-spacing: -.02em; }
.abertura h1 span { color: var(--urucum); }
.abertura p { margin: 0; max-width: 62ch; color: var(--muted); font-size: 18px; }
.camadas { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 8px 14px; }
.chip { font: 600 14px/1 var(--texto); border: 1.5px solid var(--linha); background: var(--card); color: var(--tinta); padding: 9px 13px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.chip i { width: 11px; height: 11px; border-radius: 50%; background: var(--cor, var(--tinta)); display: inline-block; }

.mapa-nota { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; padding: 10px 14px; border-top: 1px solid var(--linha); color: var(--muted); font-size: 14px; }
.pino { cursor: pointer; }
.pino .alvo { fill: transparent; }
.pino text { font-family: var(--mono); font-weight: 500; }
.pino.apagado { opacity: .18; }

.secao-titulo { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-block: 28px 12px; flex-wrap: wrap; }
.secao-titulo h2 { font-size: 26px; }
.lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; padding-bottom: 36px; }
.cartao { display: grid; grid-template-rows: auto 1fr; background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; color: inherit; text-decoration: none; }

.ficha { padding-block: 18px 40px; display: grid; gap: 22px; }

.botao { font: 700 16px/1 var(--texto); border: 0; border-radius: 999px; padding: 13px 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap; }
.botao.primario { background: var(--urucum); color: #fff; }
.botao.secundario { background: var(--card); color: var(--tinta); border: 1.5px solid var(--linha); }
.botao[disabled] { opacity: .5; cursor: default; }
.ar-btn { position: absolute; right: 12px; bottom: 12px; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; }
.dica { font-size: 14px; color: var(--muted); margin: 0; }
.texto { min-width: 0; display: grid; gap: 14px; }
.texto h1 { font-size: clamp(30px, 6vw, 46px); font-weight: 800; letter-spacing: -.015em; }
.texto p { margin: 0; max-width: 65ch; }
.fatos { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; border-top: 1px solid var(--linha); }
.fatos li { display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; padding-block: 9px; border-bottom: 1px solid var(--linha); font-size: 15px; }
.fatos b { font-family: var(--mono); font-weight: 500; color: var(--cor); font-variant-numeric: tabular-nums; }
.modelo-nota { background: var(--anil-suave); border-radius: var(--raio); padding: 14px 16px; display: grid; gap: 6px; font-size: 15px; }
.modelo-nota p { margin: 0; }
.fontes { margin: 0; padding-left: 1.1em; font-size: 15px; display: grid; gap: 4px; }
.fontes a { overflow-wrap: anywhere; }
.navega { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* marcador e sobre */
.pagina { padding-block: 22px 44px; display: grid; gap: 18px; max-width: 760px; }
.pagina h1 { font-size: clamp(30px, 6vw, 46px); font-weight: 800; }
.pagina h2 { font-size: 22px; margin-top: 8px; }
.pagina p { margin: 0; }
.passos { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
.marcadores { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.marcadores figure { margin: 0; background: #fff; border: 1px solid var(--linha); border-radius: 10px; padding: 8px; display: grid; gap: 6px; color: #161A2C; font-size: 13px; text-align: center; }
.aviso { border-left: 4px solid var(--urucum); padding: 10px 14px; background: var(--card); border-radius: 0 10px 10px 0; font-size: 15px; }
.rodape { border-top: 1px solid var(--linha); color: var(--muted); font-size: 14px; }
.rodape .envolve { padding-block: 18px 28px; display: grid; gap: 4px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

    fontes: [["Brasil de Fato: 18 de junho, Dia Nacional do Tambor de Crioula", "https://www.brasildefato.com.br/2021/06/18/18-de-junho-e-dia-nacional-do-tambor-de-crioula"],
             ["O Imparcial: conheça o espetáculo do tambor de crioula", "https://oimparcial.com.br/noticias/2017/06/conheca-o-espetaculo-do-tambor-de-crioula/"],
             ["Dossiê Tambores da Ilha", "https://www.ipatrimonio.org/wp-content/uploads/2017/05/Dossie_-tambores_da_ilha.pdf"]] },
  { id: "terreiro-mina", nome: "Terreiro de Mina", camada: "fe",
    linha: "O toque dos abatás no salão de um terreiro.",
    texto: [
      "O Tambor de Mina é uma religião afro-maranhense que cultua voduns, orixás, gentis e caboclos (encantados). No quilombo, o Terreiro de Iemanjá, fundado em 1954 no bairro Fé em Deus, é a casa de Mina mais antiga.",
      "No toque, dois abatás (tambores de duas peles sobre cavalete), o tambor da mata, o ferro e as cabaças conduzem a dança. As dançantes usam saias longas na cor da entidade, blusa branca, guias e rosários. Toy Averekete é associado a São Benedito."
    ],
    fatos: [["1954", "Terreiro de Iemanjá, no bairro Fé em Deus"], ["toque", "Abatás, tambor da mata, ferro e cabaças"], ["vestes", "Saia longa, blusa branca, guias, rosários e toalha bordada"]],
    modelo: "Salão em corte para ver o interior: tocadores, dançantes em roda, mãe de santo junto à mesa com crucifixo, imagens e velas, e bandeirolas.",
    interpretacao: "É um terreiro genérico e não reproduz nenhuma casa real. Cores, decoração e posição dos tocadores são suposições e devem ser validadas com o povo de terreiro.",
    fontes: [["Brasil de Fato: conheça a Liberdade", "https://brasildefato.com.br/2024/07/08/bumba-meu-boi-terreiros-e-tambores-conheca-liberdade-o-maior-quilombo-urbano-do-brasil-no-maranhao/"],
             ["O Imparcial: Terreiro de Yemanjá é tema de exposição", "https://oimparcial.com.br/entretenimento-e-cultura/2018/11/terreiro-de-yemanja-e-tema-de-exposicao-em-sao-luis/"],
             ["GP Mina/UFMA: Casa Fanti-Ashanti", "https://www.gpmina.ufma.br/wp-content/uploads/2017/04/LP-CFA.pdf"],
             ["UFMA: Tambor-de-Mina em São Luís", "https://repositorio.ufma.br/jspui/bitstream/1/204/1/Mina-da%20MPF%20aos%20nossos%20dias.pdf"]] },
  { id: "divino", nome: "Festa do Divino", camada: "festas",
    linha: "O Império, as caixeiras e o mastro do Divino Espírito Santo.",
    texto: [
      "A Festa do Divino Espírito Santo é uma das grandes festas do Maranhão, celebrada em Alcântara, em São Luís e também em terreiros do quilombo. O Império, formado por crianças vestidas de nobres, a tribuna com o trono, o mastro enfeitado e a bandeira do Divino com a pomba fazem parte da festa.",
      "As caixeiras, em geral mulheres mais velhas, cantam e tocam caixas pintadas de vermelho e branco ou de azul e branco. Muitas famílias que formaram a Liberdade vieram de Alcântara, onde a festa é uma tradição centenária."
    ],
    fatos: [["Império", "Imperatriz, mordomos, aias e vassalo"], ["música", "Caixeiras com caixas pintadas"], ["símbolos", "Coroa, cetro, pomba e mastro"]],
    modelo: "Cena baseada na festa de Alcântara: tribuna com trono e altar, Império, seis caixeiras, bandeireiras, mastro e mesa de doces.",
    interpretacao: "Não consultamos fotos da festa: trajes e cores das caixeiras, a altura do mastro e os rostos são interpretação a partir de textos.",
    fontes: [["O Imparcial: Festa do Divino de Alcântara, uma tradição centenária", "https://oimparcial.com.br/noticias/2026/05/festa-do-divino-espirito-santo-de-alcantara-uma-tradicao-centenaria/"],
             ["UFMA/GP Mina: Festa do Divino no Maranhão", "https://www.gpmina.ufma.br/arquivos/Festa%20do%20Divino%20no%20Maranhao.pdf"],
             ["O Imparcial: Maranhão reconhece Quilombo Liberdade como patrimônio cultural", "https://oimparcial.com.br/noticias/2025/09/maranhao-reconhece-quilombo-liberdade-como-patrimonio-cultural/"]] },
];
const META_BY = Object.fromEntries(META.map(m => [m.id, m]));
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const main = $("#conteudo");
let filtro = "todas";
try { filtro = localStorage.getItem("camada") || "todas"; } catch (e) {}

function mapaSVG() {
  const pinos = PONTOS.map(p => {
    const m = META_BY[p.id], cor = CAMADAS[p.camada].cor;
    return `<g class="pino" data-id="${p.id}" data-camada="${p.camada}" tabindex="0" role="link" aria-label="${m.numero}. ${esc(p.nome)}">
      <circle class="alvo" cx="${m.x}" cy="${m.y}" r="52"/>
      <circle class="bola" cx="${m.x}" cy="${m.y}" r="30" style="fill:${cor}" stroke="var(--card)" stroke-width="4"/>
      <text x="${m.x}" y="${m.y + 10}" text-anchor="middle" font-size="30" fill="#fff">${m.numero}</text>
      <text x="${m.x}" y="${m.y + 66}" text-anchor="middle" font-size="27" font-weight="700" fill="var(--tinta)" paint-order="stroke" stroke="var(--card)" stroke-width="7" font-family="Atkinson Hyperlegible, system-ui, sans-serif">${esc(p.nome)}</text>
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 1000 700" role="img" aria-label="Mapa ilustrativo do território quilombola da Liberdade com 8 pontos culturais">
    <rect width="1000" height="700" fill="var(--card)"/>
    <path d="M0 0H1000V70C820 150 560 60 380 120C230 170 110 110 0 160Z" fill="var(--rio)"/>
    <text x="60" y="78" font-family="IBM Plex Mono, monospace" font-size="22" letter-spacing="4" fill="var(--anil)">RIO ANIL</text>
    <path d="M0 200C130 150 240 210 390 160C560 105 820 195 1000 115" fill="none" stroke="var(--palha)" stroke-width="9" stroke-linecap="round"/>
    <text x="520" y="186" font-size="19" fill="var(--palha)" font-family="IBM Plex Mono, monospace">AV. DO REGGAE (IV CENTENÁRIO)</text>
    <path d="M60 240C300 200 700 270 950 200L965 650C600 690 300 640 40 670Z" fill="none" stroke="var(--urucum)" stroke-width="3" stroke-dasharray="12 8"/>
    <text x="70" y="640" font-size="18" fill="var(--urucum)" font-family="IBM Plex Mono, monospace">TERRITÓRIO QUILOMBOLA</text>
    ${pinos}
  </svg>`;
}

function viewMapa() {
  const chips = [["todas", "Todas as camadas", "var(--tinta)"], ...Object.entries(CAMADAS).map(([k, v]) => [k, v.nome, v.cor])]
    .map(([k, n, c]) => `<button class="chip" type="button" data-camada="${k}" aria-pressed="${filtro === k}" style="--cor:${c}"><i></i>${n}</button>`).join("");
  const cartoes = PONTOS.map(p => {
    const m = META_BY[p.id], c = CAMADAS[p.camada];
    return `<a class="cartao" href="#ponto-${p.id}" data-camada="${p.camada}" style="--cor:${c.cor}">
      <img src="capas/${p.id}.jpg" alt="Prévia do modelo 3D: ${esc(p.nome)}" loading="lazy" width="960" height="540">
      <div class="corpo"><span class="tag">${c.nome}</span><h3><span class="num">${m.numero}</span>${esc(p.nome)}</h3><p>${esc(p.linha)}</p></div></a>`;
  }).join("");
  main.innerHTML = `<div class="envolve">
    <section class="abertura">
      <span class="rotulo" style="color:var(--urucum)">Quilombo Urbano da Liberdade · São Luís – MA</span>
      <h1>Liberdade em <span>Camadas</span></h1>
      <p>Um mapa cultural em realidade aumentada. Toque num ponto para ver a história, girar a maquete em 3D e colocá-la sobre a mesa pela câmera do celular.</p>
    </section>
    <div class="camadas" role="group" aria-label="Filtrar por camada">${chips}</div>
    <div class="mapa-caixa">${mapaSVG()}
      <div class="mapa-nota"><span>Mapa ilustrativo, fora de escala. Posições aproximadas.</span><span>Camboa · Diamante · Fé em Deus · Liberdade · Sítio do Meio</span></div>
    </div>
    <div class="secao-titulo"><h2>Pontos do mapa</h2><a href="#marcador">Usar com o mapa impresso</a></div>
    <div class="lista">${cartoes}</div></div>`;
  main.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { filtro = b.dataset.camada; try { localStorage.setItem("camada", filtro); } catch (e) {} aplicaFiltro(); }));
  main.querySelectorAll(".pino").forEach(g => {
    const ir = () => { location.hash = "ponto-" + g.dataset.id; };
    g.addEventListener("click", ir);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ir(); } });
  });
  aplicaFiltro();
}
function aplicaFiltro() {
  main.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.camada === filtro)));
  main.querySelectorAll(".pino").forEach(g => g.classList.toggle("apagado", filtro !== "todas" && g.dataset.camada !== filtro));
  main.querySelectorAll(".cartao").forEach(c => { c.hidden = filtro !== "todas" && c.dataset.camada !== filtro; });
}

function viewPonto(id) {
  const i = PONTOS.findIndex(p => p.id === id);
  if (i < 0) return viewMapa();
  const p = PONTOS[i], m = META_BY[id], c = CAMADAS[p.camada];
  const ant = PONTOS[(i + PONTOS.length - 1) % PONTOS.length], prox = PONTOS[(i + 1) % PONTOS.length];
  const fontes = p.fontes.map(([t, u]) => u ? `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>` : `<li>${esc(t)}</li>`).join("");
  const fatos = p.fatos.map(([k, v]) => `<li><b>${esc(k)}</b><span>${esc(v)}</span></li>`).join("");
  const mb = String(m.mb).replace(".", ",");
  main.innerHTML = `<div class="envolve" style="--cor:${c.cor}">
    <a class="voltar" href="#mapa">← Voltar ao mapa</a>
    <article class="ficha">
      <div class="visor">
        <div class="palco">
          <model-viewer id="mv" poster="capas/${p.id}.jpg" alt="Maquete 3D: ${esc(p.nome)}" camera-controls touch-action="pan-y"
            ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" shadow-intensity="1" exposure="1.05"
            camera-orbit="25deg 62deg auto" interaction-prompt="auto">
            <button slot="ar-button" class="botao primario ar-btn" type="button">Ver no seu espaço (RA)</button>
          </model-viewer>
          <button class="botao primario carregar" id="carregar" type="button">Abrir maquete 3D · ${mb} MB</button>
        </div>
        <p class="dica" id="dica">Maquete na escala ${m.escala}. Arraste para girar e use dois dedos para aproximar. No celular, o botão de RA coloca a maquete sobre uma superfície real.</p>
        <div class="acoes">
          <button class="botao secundario" id="ouvir" type="button">Ouvir o texto</button>
          <a class="botao secundario" href="#marcador">Ver pelo mapa-marcador</a>
        </div>
      </div>
      <div class="texto">
        <span class="tag">${m.numero} · ${c.nome}</span>
        <h1>${esc(p.nome)}</h1>
        ${p.texto.map(t => `<p>${esc(t)}</p>`).join("")}
        <ul class="fatos">${fatos}</ul>
        <div class="modelo-nota"><span class="rotulo">Sobre o modelo 3D</span><p>${esc(p.modelo)}</p><p><b>Interpretação:</b> ${esc(p.interpretacao)}</p></div>
        <div><h2 style="font-size:20px;margin-bottom:8px">Fontes</h2><ol class="fontes">${fontes}</ol></div>
        <div class="navega"><a href="#ponto-${ant.id}">← ${esc(ant.nome)}</a><a href="#ponto-${prox.id}">${esc(prox.nome)} →</a></div>
      </div>
    </article></div>`;
  const mv = $("#mv"), bt = $("#carregar");
  bt.addEventListener("click", () => { bt.disabled = true; bt.textContent = "Carregando…"; mv.src = `modelos/${p.id}.glb`; });
  mv.addEventListener("load", () => { bt.hidden = true; });
  mv.addEventListener("error", () => { bt.disabled = false; bt.textContent = "Não carregou. Tentar de novo"; });
  const ouvir = $("#ouvir");
  if (!("speechSynthesis" in window)) { ouvir.hidden = true; }
  else ouvir.addEventListener("click", () => {
    if (speechSynthesis.speaking) { speechSynthesis.cancel(); ouvir.textContent = "Ouvir o texto"; return; }
    const u = new SpeechSynthesisUtterance(p.nome + ". " + p.texto.join(" "));
    u.lang = "pt-BR"; u.rate = 1;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith("pt"));
    if (v) u.voice = v;
    u.onend = () => { ouvir.textContent = "Ouvir o texto"; };
    ouvir.textContent = "Parar áudio";
    speechSynthesis.speak(u);
  });
}

function viewMarcador() {
  const figs = PONTOS.map(p => `<figure><img src="marcadores/${p.id}.png" alt="Marcador ${META_BY[p.id].numero}" width="160" height="160"><figcaption>${META_BY[p.id].numero}. ${esc(p.nome)}</figcaption></figure>`).join("");
  main.innerHTML = `<div class="envolve"><section class="pagina">
    <span class="rotulo" style="color:var(--urucum)">Realidade aumentada com o mapa impresso</span>
    <h1>Mapa-marcador</h1>
    <p>Cada ponto do mapa impresso tem um marcador quadrado. Quando a câmera do celular reconhece o marcador, a maquete 3D daquele ponto aparece em cima do papel.</p>
    <h2>Como usar</h2>
    <ol class="passos">
      <li>Imprima o mapa-marcador em A3 (ou os cartões em A4) na escala 100%, sem “ajustar à página”.</li>
      <li>Abra este site no celular e toque em <b>Abrir câmera</b>. Permita o uso da câmera.</li>
      <li>Aponte para um marcador, a uns 30 a 50 cm, com boa luz e sem reflexo no papel.</li>
      <li>Toque no nome que aparece na tela para abrir a ficha completa do ponto.</li>
    </ol>
    <div class="acoes">
      <a class="botao primario" href="ar.html">Abrir câmera</a>
      <a class="botao secundario" href="impressao/mapa-marcador.pdf" target="_blank" rel="noopener">Mapa-marcador (A3, PDF)</a>
      <a class="botao secundario" href="impressao/cartoes-marcadores.pdf" target="_blank" rel="noopener">Cartões (A4, PDF)</a>
    </div>
    <p class="aviso">A câmera precisa do site aberto direto no navegador do celular (Chrome no Android, Safari no iPhone), com endereço https. Se a página estiver aberta dentro de outro aplicativo, use “abrir no navegador”.</p>
    <h2>Marcadores</h2>
    <div class="marcadores">${figs}</div>
  </section></div>`;
}

function viewSobre() {
  main.innerHTML = `<div class="envolve"><section class="pagina">
    <span class="rotulo" style="color:var(--urucum)">Sobre o projeto</span>
    <h1>Realidade aumentada e educação patrimonial no maior quilombo urbano do Brasil</h1>
    <p>O Território Quilombola Liberdade reúne memórias, práticas culturais e espaços de resistência fundamentais à identidade afro-maranhense. Este site é a parte digital do projeto <b>Liberdade em Camadas</b>, que desenvolve e avalia uma experiência de realidade aumentada sobre a história e as referências culturais do bairro, com estudantes do Ensino Médio.</p>
    <h2>Como o projeto funciona</h2>
    <p>Pesquisa aplicada, de abordagem mista e delineamento quase-experimental, precedida de pesquisa bibliográfica, documental e visita de campo, com validação do conteúdo por representante cultural da comunidade. Trinta estudantes do IEMA Pleno São Luís – Cidade Operária participam em dois grupos: um usa um painel ilustrado e o outro usa o mesmo conteúdo em RA, acionado pelo mapa-marcador. Questionários de conhecimento e uma escala de interesse são aplicados antes e depois da atividade.</p>
    <h2>Equipe</h2>
    <p>Fernando Lucas Santos Cordeiro (IEMA Pleno São Luís – Cidade Operária), Pedro Otavio de Souza Rocha e Julia Santos Ferreira.<br>Eixo II: Patrimônio Material/Imaterial e Território – Outras Narrativas Possíveis.</p>
    <h2>Sobre os modelos 3D</h2>
    <p>As maquetes foram construídas a partir de fotos e de fontes jornalísticas e acadêmicas. Cada ficha separa o que vem das fontes do que é interpretação. Os modelos devem ser revistos com a comunidade, que é a referência para a seleção e a interpretação dos conteúdos.</p>
    <h2>Referências</h2>
    <ol class="fontes">
      <li>BRAGA, Marcio Gomes. <i>Ensino médio e a história local: o Quilombo Urbano da Liberdade em São Luís do Maranhão</i>. Dissertação (Mestrado Profissional em Ensino de História), UFMA, 2025.</li>
      <li>CHANG, Hsin-Yi et al. Ten years of augmented reality in education: a meta-analysis of (quasi-)experimental studies to investigate the impact. <i>Computers &amp; Education</i>, v. 191, 104641, 2022. <a href="https://doi.org/10.1016/j.compedu.2022.104641" target="_blank" rel="noopener">doi:10.1016/j.compedu.2022.104641</a></li>
      <li>SÃO LUÍS (Município). Prefeito Eduardo Braide inaugura Centro de Cultura e Turismo do Quilombo Urbano no bairro Liberdade. 21 nov. 2023. <a href="https://www.saoluis.ma.gov.br/portal/noticias/0/3/930" target="_blank" rel="noopener">saoluis.ma.gov.br</a></li>
      <li>SILVA, Mariana Queen Cardoso da. <i>Quilombo urbano Liberdade, patrimônio afro de São Luís-MA: a sistemática da acessibilidade aos direitos culturais</i>. Dissertação (Mestrado em Cultura e Sociedade), UFMA, 2023.</li>
    </ol>
  </section></div>`;
}

function rota() {
  const h = (location.hash || "#mapa").slice(1);
  const secao = h.startsWith("ponto-") ? "mapa" : (["marcador", "sobre"].includes(h) ? h : "mapa");
  document.querySelectorAll("[data-nav]").forEach(a => { if (a.dataset.nav === secao) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (h.startsWith("ponto-")) viewPonto(h.slice(6));
  else if (h === "marcador") viewMarcador();
  else if (h === "sobre") viewSobre();
  else viewMapa();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", rota);
rota();
</script>
</body></html>
